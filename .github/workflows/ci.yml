name: native-local-android
on: [push, pull_request, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: python scripts/check-local-android.py
      - run: gradle --no-daemon -p apps/android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chronoflow-local-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
